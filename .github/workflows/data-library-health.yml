name: Data Library health

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  health:
    name: Health checks and site smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documentation dependencies
        run: pip install -r requirements.txt
      - name: Run Data Library health checks
        run: python scripts/check_data_library_health.py
      - name: Build MkDocs site
        run: mkdocs build --clean --site-dir site
      - name: Run built-site smoke checks
        run: python scripts/check_site_smoke.py site
